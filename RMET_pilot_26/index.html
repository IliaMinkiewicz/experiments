<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Экраны переключает script.js: в каждый момент виден один section. -->

<!-- Экран экспериментатора: номер вручную, если его не удалось получить автоматически -->
<section id="screen-setup" class="screen form-screen" hidden>
  <div class="card">
    <h1>Параметры эксперимента</h1>
    <p class="muted">Заполняет экспериментатор.</p>
    <div class="field">
      <label for="f-pid">Номер участника</label>
      <input id="f-pid" type="text" inputmode="numeric" autocomplete="off" spellcheck="false">
    </div>
    <p id="plan" class="muted small"></p>
    <p id="setup-load" class="muted small"></p>
    <p id="setup-error" class="err"></p>
    <button id="b-setup" class="primary">Продолжить</button>
  </div>
</section>

<!-- Согласие -->
<section id="screen-consent" class="screen form-screen" hidden>
  <div class="card">
    <div id="consent-text" class="scrollbox"></div>
    <button id="b-consent" class="primary">Согласен(на)</button>
  </div>
</section>

<!-- Анкета -->
<section id="screen-demo" class="screen form-screen" hidden>
  <div class="card">
    <h1>Несколько вопросов о вас</h1>
    <div class="field">
      <label for="f-age">Возраст (полных лет)</label>
      <input id="f-age" type="number" min="18" max="45" step="1" inputmode="numeric">
    </div>
    <div class="field">
      <label for="f-sex">Пол</label>
      <select id="f-sex">
        <option value="">— выберите —</option>
        <option value="ж">женский</option>
        <option value="м">мужской</option>
      </select>
    </div>
    <div class="field">
      <label for="f-lang">Русский язык для вас родной?</label>
      <select id="f-lang">
        <option value="">— выберите —</option>
        <option value="да">да</option>
        <option value="нет">нет</option>
      </select>
    </div>
    <p id="demo-status" class="muted small"></p>
    <p id="demo-error" class="err"></p>
    <button id="b-demo" class="primary">Продолжить</button>
  </div>
</section>

<!-- Переход в полноэкранный режим; кнопка включается, когда загружены изображения -->
<section id="screen-full" class="screen form-screen" hidden>
  <div class="card">
    <p id="full-text"></p>
    <p id="load-status" class="muted small"></p>
    <button id="b-retry" class="secondary" hidden>Загрузить ещё раз</button>
    <button id="b-full" class="primary" disabled>Начать</button>
  </div>
</section>

<!-- Инструкции, тренировка, перерывы: текст и кнопка -->
<section id="screen-msg" class="screen form-screen" hidden>
  <div class="card">
    <div id="msg-body" class="text"></div>
    <p id="msg-status" class="muted small"></p>
    <button id="b-msg" class="primary">Продолжить</button>
  </div>
</section>

<!-- Фиксационный крест -->
<section id="screen-fix" class="screen center-screen" hidden>
  <div class="fixation">+</div>
</section>

<!-- Проба: изображение и четыре слова по углам с номерами клавиш 1–4 -->
<section id="screen-trial" class="screen trial-screen" hidden>
  <div class="board">
    <div class="opt left" id="o0"><span class="key">1</span><span class="word" id="w0"></span></div>
    <div class="opt right" id="o1"><span class="key">2</span><span class="word" id="w1"></span></div>
    <div class="stim" id="stim"></div>
    <div class="opt left" id="o2"><span class="key">3</span><span class="word" id="w2"></span></div>
    <div class="opt right" id="o3"><span class="key">4</span><span class="word" id="w3"></span></div>
  </div>
</section>

<!-- Конец -->
<section id="screen-end" class="screen form-screen" hidden>
  <div class="card">
    <div id="end-text" class="text"></div>
    <p id="end-status" class="muted small"></p>
    <button id="b-download" class="secondary">Скачать файл с данными</button>
  </div>
</section>

<script src="stimuli.js"></script>
<script src="practice.js"></script>
<script src="texts.js"></script>
<script src="design.js"></script>
<script src="script.js"></script>
</body>
</html>
